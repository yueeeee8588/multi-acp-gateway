name: Auto Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'Cargo.toml'
      - 'Dockerfile'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify version consistency
        id: version
        shell: bash
        run: |
          set -euo pipefail

          CARGO_VER=$(awk '
            /^\[package\]/ { in_pkg=1; next }
            /^\[/ { in_pkg=0 }
            in_pkg && /^version[[:space:]]*=/ {
              gsub(/.*=[[:space:]]*"|".*/, "")
              print
              exit
            }
          ' Cargo.toml)

          DOCKER_VER=$(sed -n 's/^LABEL org\.opencontainers\.image\.version="\([^"]*\)".*/\1/p' Dockerfile | head -n 1)

          LOCK_VER=$(awk '
            /^\[\[package\]\]/ { in_pkg=1; match_pkg=0; next }
            /^\[/ { in_pkg=0 }
            in_pkg && /^name = "multi-acp-gateway"$/ { match_pkg=1; next }
            in_pkg && match_pkg && /^version = / {
              gsub(/.*= "|"$/, "")
              print
              exit
            }
          ' Cargo.lock)

          echo "CARGO_VER=$CARGO_VER"
          echo "DOCKER_VER=$DOCKER_VER"
          echo "LOCK_VER=$LOCK_VER"

          if [ -z "$CARGO_VER" ] || [ -z "$DOCKER_VER" ] || [ -z "$LOCK_VER" ]; then
            echo "::error::Failed to parse version from Cargo.toml, Dockerfile, or Cargo.lock"
            exit 1
          fi

          if [ "$CARGO_VER" != "$DOCKER_VER" ] || [ "$CARGO_VER" != "$LOCK_VER" ]; then
            echo "::error::Version mismatch: Cargo.toml=$CARGO_VER, Dockerfile=$DOCKER_VER, Cargo.lock=$LOCK_VER"
            exit 1
          fi

          if [ "${{ github.ref_type }}" = "tag" ] && [ "${{ github.ref_name }}" != "v${CARGO_VER}" ]; then
            echo "::error::Tag ${{ github.ref_name }} does not match v${CARGO_VER}"
            exit 1
          fi

          echo "version=$CARGO_VER" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${{ steps.version.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping."
            exit 0
          fi
          gh release create "$TAG" --title "$TAG" --target "$GITHUB_SHA" --generate-notes
