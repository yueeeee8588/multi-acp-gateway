name: Auto Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_build: ${{ steps.create_release.outputs.should_build }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify version consistency
        id: version
        shell: bash
        run: |
          set -euo pipefail

          CARGO_VER=$(awk '
            /^\[package\]/ { in_pkg=1; next }
            /^\[/ { in_pkg=0 }
            in_pkg && /^version[[:space:]]*=/ {
              gsub(/.*=[[:space:]]*"|".*/, "")
              print
              exit
            }
          ' Cargo.toml)

          DOCKER_VER=$(sed -n 's/^LABEL org\.opencontainers\.image\.version="\([^"]*\)".*/\1/p' Dockerfile | head -n 1)

          LOCK_VER=$(awk '
            /^\[\[package\]\]/ { in_pkg=1; match_pkg=0; next }
            /^\[/ { in_pkg=0 }
            in_pkg && /^name = "multi-acp-gateway"$/ { match_pkg=1; next }
            in_pkg && match_pkg && /^version = / {
              gsub(/.*= "|"$/, "")
              print
              exit
            }
          ' Cargo.lock)

          ISS_VER=$(sed -n 's/^[[:space:]]*#define[[:space:]]\+AppVersion[[:space:]]\+"\([^"]*\)".*/\1/p' installer/setup.iss | head -n 1)

          echo "CARGO_VER=$CARGO_VER"
          echo "DOCKER_VER=$DOCKER_VER"
          echo "LOCK_VER=$LOCK_VER"
          echo "ISS_VER=$ISS_VER"

          if [ -z "$CARGO_VER" ] || [ -z "$DOCKER_VER" ] || [ -z "$LOCK_VER" ] || [ -z "$ISS_VER" ]; then
            echo "::error::Failed to parse version from Cargo.toml, Dockerfile, Cargo.lock, or installer/setup.iss"
            exit 1
          fi

          if [ "$CARGO_VER" != "$DOCKER_VER" ] || [ "$CARGO_VER" != "$LOCK_VER" ] || [ "$CARGO_VER" != "$ISS_VER" ]; then
            echo "::error::Version mismatch: Cargo.toml=$CARGO_VER, Dockerfile=$DOCKER_VER, Cargo.lock=$LOCK_VER, installer/setup.iss=$ISS_VER"
            exit 1
          fi

          if [ "${{ github.ref_type }}" = "tag" ] && [ "${{ github.ref_name }}" != "v${CARGO_VER}" ]; then
            echo "::error::Tag ${{ github.ref_name }} does not match v${CARGO_VER}"
            exit 1
          fi

          echo "version=$CARGO_VER" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${{ steps.version.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.ref_type }}" = "tag" ]; then
              echo "should_build=true" >> "$GITHUB_OUTPUT"
            else
              echo "Release already exists for branch push; skipping installer build."
              echo "should_build=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          gh release create "$TAG" --title "$TAG" --target "$GITHUB_SHA" --generate-notes
          echo "should_build=true" >> "$GITHUB_OUTPUT"

  build-windows-installer:
    runs-on: windows-latest
    needs: release
    if: ${{ needs.release.outputs.should_build == 'true' }}
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Build frontend
        working-directory: web
        shell: pwsh
        run: |
          npm ci
          npm run build

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binaries
        shell: pwsh
        run: cargo build --release --locked

      - name: Run sensitive info zero-leak gate
        shell: pwsh
        run: pwsh -File scripts/scan-sensitive.ps1 -TargetDir .

      - name: Stage Windows bundle
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_OAUTH_CLIENT_ID: ${{ secrets.GEMINI_OAUTH_CLIENT_ID }}
          GEMINI_OAUTH_CLIENT_SECRET: ${{ secrets.GEMINI_OAUTH_CLIENT_SECRET }}
        run: pwsh -File scripts/stage-windows-bundle.ps1 -Profile public -SkipBuild -RequireOAuthProfile

      - name: Compile Inno Setup installer
        shell: pwsh
        env:
          APP_VERSION: ${{ needs.release.outputs.version }}
        run: |
          $isccCmd = Get-Command iscc -ErrorAction SilentlyContinue
          if ($null -ne $isccCmd) {
            $iscc = $isccCmd.Source
          } else {
            $fallback = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
            if (-not (Test-Path -LiteralPath $fallback)) {
              throw "Inno Setup compiler (ISCC.exe) not found in PATH or at $fallback"
            }
            $iscc = $fallback
          }
          & $iscc "/DAppVersion=$env:APP_VERSION" "installer\setup.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "ISCC.exe failed with exit code $LASTEXITCODE"
          }

      - name: Generate SHA256SUMS.txt
        shell: pwsh
        env:
          APP_VERSION: ${{ needs.release.outputs.version }}
        run: |
          $installerName = "MultiAcpGateway-v$env:APP_VERSION-win64-Setup.exe"
          $installerPath = Join-Path "dist" $installerName
          if (-not (Test-Path -LiteralPath $installerPath)) {
            throw "Expected installer not found at $installerPath"
          }
          $hash = (Get-FileHash -LiteralPath $installerPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $installerName" | Set-Content -LiteralPath "dist\SHA256SUMS.txt" -Encoding ascii

      - name: Upload Windows installer assets to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_VERSION: ${{ needs.release.outputs.version }}
        run: |
          $tag = "v$env:APP_VERSION"
          $installerPath = "dist/MultiAcpGateway-v$env:APP_VERSION-win64-Setup.exe"
          gh release upload "$tag" "$installerPath" "dist/SHA256SUMS.txt" --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "gh release upload failed with exit code $LASTEXITCODE"
          }
